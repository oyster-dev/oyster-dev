name: snake

on:
  schedule:
    - cron: "0 15 * * *" # 毎日 0:00 JST
  workflow_dispatch:

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # output ブランチへの push
    steps:
      - uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          # 藍色の濃淡の草と、レベルアップの金色の蛇
          outputs: |
            dist/snake-light.svg?color_snake=#c99a1e&color_dots=#ebedf0,#c3dcea,#7cc2e6,#2b84b5,#165e83
            dist/snake-dark.svg?color_snake=#ffe27a&color_dots=#161b22,#0f2f45,#165e83,#2b84b5,#7cc2e6

      - uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
